# Atoms-Demo · A 机 nginx 站点配置（atoms.lexmin.cn）
#
# 要点：
#   - /api/ 反代到 API，并【关闭 SSE buffering】，否则聊天/流式不可见
#   - /share/ 也要反代到 API（公开分享走 API，不能落到 SPA 兜底）
#   - / 为静态 SPA，未命中回退 index.html
#
# 部署：放到 /etc/nginx/sites-available/atoms.lexmin.cn 并软链到 sites-enabled，
#       nginx -t && systemctl reload nginx。

server {
    listen 80;
    server_name atoms.lexmin.cn;
    location /.well-known/acme-challenge/ { root /var/www/atoms; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name atoms.lexmin.cn;

    ssl_certificate /etc/letsencrypt/live/atoms.lexmin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atoms.lexmin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/atoms;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / { try_files $uri /index.html; }
}
