# Another Atoms 前门（A 机 nginx）
#
#  已发布应用： <projectId>.atoms.lexmin.cn
#     /       → 回源 COS（前端产物）
#     /api/*  → 经隧道 → B 沙箱服务 → 该应用常驻后端容器
#
#  开发预览：  dev-<projectId>.atoms.lexmin.cn
#     /       → 经隧道 → B 沙箱服务 → 开发沙箱内的 dist
#     /api/*  → 经隧道 → B 沙箱服务 → 开发沙箱内运行的应用后端
#
#  证书：acme.sh 泛域名证书（atoms.lexmin.cn + *.atoms.lexmin.cn）

server {
    listen 80;
    server_name "~^(dev-)?[0-9a-f-]{36}\.atoms\.lexmin\.cn$";
    location / { return 301 https://$host$request_uri; }
}

# ---------- 已发布应用 ----------
server {
    listen 443 ssl;
    server_name "~^(?<app>[0-9a-f-]{36})\.atoms\.lexmin\.cn$";

    ssl_certificate     /etc/nginx/certs/atoms-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/atoms-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    resolver 127.0.0.53 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/sandbox/$app/app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass https://atoms-1300325094.cos.ap-guangzhou.myqcloud.com/apps/$app$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host atoms-1300325094.cos.ap-guangzhou.myqcloud.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "inline" always;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        proxy_pass https://atoms-1300325094.cos.ap-guangzhou.myqcloud.com/apps/$app/index.html;
        proxy_ssl_server_name on;
        proxy_set_header Host atoms-1300325094.cos.ap-guangzhou.myqcloud.com;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "inline" always;
    }
}

# ---------- 开发预览 ----------
server {
    listen 443 ssl;
    server_name "~^dev-(?<app>[0-9a-f-]{36})\.atoms\.lexmin\.cn$";

    ssl_certificate     /etc/nginx/certs/atoms-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/atoms-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/sandbox/$app/devapp$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:4000/sandbox/$app/preview$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "no-store" always;
    }
}
