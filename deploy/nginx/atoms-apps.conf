# Atoms-Demo · 已发布应用前门（*.atoms.lexmin.cn）
#
# 路由：
#   /       → 该应用前端产物（本地目录 /srv/atoms-apps/<projectId>）
#   /api/*  → 经隧道 → B 机沙箱服务 → 该应用常驻后端容器
#
# 证书：acme.sh 泛域名证书（atoms.lexmin.cn + *.atoms.lexmin.cn）

server {
    listen 80;
    server_name "~^(?<app>[0-9a-f-]{36})\.atoms\.lexmin\.cn$";
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name "~^(?<app>[0-9a-f-]{36})\.atoms\.lexmin\.cn$";

    ssl_certificate     /etc/nginx/certs/atoms-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/atoms-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # proxy_pass 含变量时，nginx 需自带 resolver（用于解析 COS 域名）
    resolver 127.0.0.53 valid=30s ipv6=off;

    root /srv/atoms-apps/$app;
    index index.html;

    location /api/ {
        # 变量在 proxy_pass 中会“原样使用”，这里直接拼出目标 URI
        proxy_pass http://127.0.0.1:4000/sandbox/$app/app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # 前端静态：回源 COS（<bucket>/apps/<projectId>/）
    location / {
        proxy_pass https://atoms-1300325094.cos.ap-guangzhou.myqcloud.com/apps/$app$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host atoms-1300325094.cos.ap-guangzhou.myqcloud.com;
        proxy_set_header X-Real-IP $remote_addr;
        # COS 在压缩响应时会带 Content-Disposition: attachment（导致浏览器下载），
        # 这里不让上游压缩，并兜底屏蔽该头
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "inline" always;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        proxy_pass https://atoms-1300325094.cos.ap-guangzhou.myqcloud.com/apps/$app/index.html;
        proxy_ssl_server_name on;
        proxy_set_header Host atoms-1300325094.cos.ap-guangzhou.myqcloud.com;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        # HTML 不缓存，避免代理/浏览器缓存旧响应
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "inline" always;
    }
}
