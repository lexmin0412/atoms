<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Atoms 品牌标识：点阵 + 轨道 + 核（为 16px 标签栏优化：实底 + 加粗描边 + 白色） -->
  <rect width="32" height="32" rx="7.5" fill="#d84b00" />
  <ellipse
    cx="16"
    cy="16"
    rx="12"
    ry="5.2"
    transform="rotate(-32 16 16)"
    fill="none"
    stroke="#fff"
    stroke-width="2.2"
    opacity="0.5"
  />
  <g fill="#fff" opacity="0.5">
    <circle cx="5.6" cy="5.6" r="2.1" />
    <circle cx="16" cy="5.6" r="2.1" />
    <circle cx="26.4" cy="5.6" r="2.1" />
    <circle cx="5.6" cy="16" r="2.1" />
    <circle cx="26.4" cy="16" r="2.1" />
    <circle cx="5.6" cy="26.4" r="2.1" />
    <circle cx="16" cy="26.4" r="2.1" />
    <circle cx="26.4" cy="26.4" r="2.1" />
  </g>
  <circle cx="16" cy="16" r="4.2" fill="#fff" />
</svg>
